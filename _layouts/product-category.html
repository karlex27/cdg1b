---
layout: default
show_sidebar: false
---

<div class="columns is-multiline">

  <div class="column is-12">
    {{ page.content }}
  </div>

  {% assign items = page.pdfs %}

  {% for pdf in items %}
  <div class="column is-4-desktop is-6-tablet">

    <div class="card">

      <div class="card-content">

        <p class="title is-5">{{ pdf.name }}</p>

        <div class="buttons">
          <a href="{{ pdf.file | relative_url }}"
             target="_blank"
             rel="noopener noreferrer"
             class="button is-small is-primary">
            Open PDF
          </a>
        </div>

      </div>

    </div>

  </div>
{% endfor %}

</div>
